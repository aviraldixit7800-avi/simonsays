<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simon Says Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>Simon Says</h1>
        

        <h2>Press any key to start</h2>

        <div class="score-board">
            <div>
                <span>Level</span>
                <strong id="level">0</strong>
            </div>

            <div>
                <span>High Score</span>
                
                <strong id="high-score">0</strong>
            </div>
        </div>

        <div class="btn-container">

            <div class="line-one">
                <div class="btn red" id="red"></div>
                <div class="btn yellow" id="yellow"></div>
            </div>

            <div class="line-two">
                <div class="btn green" id="green"></div>
                <div class="btn blue" id="blue"></div>
            </div>

        </div>

        <p class="instruction">
            Watch the pattern and repeat it!
        </p>
        <p class="instruction">
            by:-aviral dixit
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
